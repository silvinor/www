theme:
  scheme: light dark
  # wrapper:
  #   class: "one or-more wrapper-classes"
  # header:
  #   class: "one or-more header-classes"
  #   inner:
  #     class: "one or-more header-inner-classes"
  navbar:
    # link: /
    # logo: /apple-touch-icon.png
    # brand: "Silvino Rodrigues"
    container: 1 # 1 = nav > div:.container; 2 = div:.container > nav; 0 = nav
    class: "sticky-top bg-body-tertiary border-bottom shadow-sm py-1"
    items:
      class: "me-auto ms-auto"
  main:
    class: "container py-4"
  #   inner:
  #     class: "one or-more main-inner-classes"
  footer:
    class: "container"
    # inner:
    #   class: "one or-more footer-inner-classes mt-4"
    copyright: 2026
    brand: "Silvino Rodrigues"
    # extra: "</small><span class=\"text-danger\">Extra info here!</span><small>"
  color: "#375a7f"
  features:
    detect_os: 1       # 0 (default) = no, 1 = yes
    external_links: 2  # 0 (default) = off, 1 = make target _blank, 2 = add icon, 3 = both
    to_top_btn: 1      # 0 (default) = off, 1 = on
    tool_tips: 1       # 0 (default) = off, 1 = on
    disable_seo: 0     # 0 (default) SEO is ON, 1 = SEO is OFF / not generated
css:
  bootstrap:
    # Bootlace, a Bootstrap in-place-replace
    url: "https://cdn.jsdelivr.net/gh/silvinor/bootlace@5.3.9/dist/css/bootlace.min.css"
    hash: "sha256-1taxrAixKslxeg3l6rizqeGPV/TqVJtYWpyRukODMFo="
  fontawesome:
    # FontAwesome 7
    url: "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    hash: "sha256-4Lad8m4ZWW1Lgb9+sMVLYEfnIh7BjV1NQMEe79Pviks="
js:
  popper:
    # Popper JS v2
    url: "https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    hash: "sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
  bootstrap:
    # Bootstrap v5.3.8
    url: https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js
    hash: "sha256-rs98T2QguTYrysS3I/ILYXg1ufLcWwex6VpjAA4s62w="
